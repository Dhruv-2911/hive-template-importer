# A fixed project name keeps the network called hive_default whatever folder the repo is cloned into
# (README and the e2e config use it).
name: hive

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
